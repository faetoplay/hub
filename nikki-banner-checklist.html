<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Before 3.0 Checklist · FaetoPlay</title>
<meta name="description" content="What to wrap up in Infinity Nikki before Version 3.0 lands: expiring 2.11 content first, then the permanent cleanup worth doing before a new region opens.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Karla:wght@400;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Palette sampled from the "Tales Woven in Time" event splash (2.11): a snowy
     night-blue ground, evergreen for the tab panes, ribbon gold and candle-cream
     for accents, holly red for urgency. Token names are historical — every colour
     on the page derives from them, so retheming is just this block. */
  :root{
    --bronze-deep:#0E1626;     /* night sky */
    --bronze:#172339;
    --bronze-lift:#213350;
    --pane:#1B3530;            /* evergreen: tab panes and the active tab */
    --card:rgba(246,227,180,.07);
    --gold-dim:#8E6F3C;
    --gold:#D9B46A;            /* ribbon gold */
    --gold-bright:#F7E6BC;     /* candlelight */
    --cream:#F7F0E6;           /* snow */
    --dim:#B3AC9B;
    --alarm:#E2635B;           /* holly red */
    --line:rgba(217,180,106,.22);
  }
  *{box-sizing:border-box}
  body{
    margin:0;color:var(--cream);
    font:400 17px/1.65 Karla,system-ui,sans-serif;
    padding:0 24px 96px;
    background:var(--bronze-deep);
    background-image:radial-gradient(115% 60% at 50% 0%, var(--bronze-lift) 0%, var(--bronze) 45%, var(--bronze-deep) 80%);
    background-attachment:fixed;
    min-height:100vh;
  }
  .wrap{max-width:1120px;margin:0 auto}
  a{color:var(--gold)}
  :focus-visible{outline:2px solid var(--gold-bright);outline-offset:3px;border-radius:4px}

  .back{display:inline-block;margin:34px 0 0;font-size:14px;color:var(--dim);text-decoration:none}
  .back:hover{color:var(--gold-bright)}

  h1{
    font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;
    font-size:clamp(36px,8vw,54px);line-height:1.05;letter-spacing:.005em;margin:18px 0 6px;
    background:linear-gradient(98deg,var(--gold-bright) 8%,var(--gold) 52%,var(--gold-dim) 96%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .sub{color:var(--dim);margin:0 0 34px;font-size:15.5px}

  /* Banner status card */
  .status{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:26px;display:flex;flex-wrap:wrap;gap:24px 44px;align-items:flex-end;
  }
  .big{font-family:'DM Mono',monospace;font-weight:500;font-size:54px;line-height:.9;color:var(--gold-bright)}
  .big small,.stat small{
    display:block;font-family:Karla,sans-serif;font-size:11px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--dim);margin-bottom:9px;font-weight:600;
  }
  .stat{font-family:'DM Mono',monospace;font-size:19px;color:var(--cream)}
  .track{height:3px;background:rgba(211,175,101,.16);border-radius:2px;margin-top:22px;width:100%;overflow:hidden}
  .track > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright))}

  /* Pinned reminders. Not tasks — no checkbox, no save state, not in the tally. */
  .reminder{
    display:flex;gap:6px 14px;align-items:baseline;flex-wrap:wrap;
    background:var(--card);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:10px;
    padding:15px 19px;margin-top:20px;
  }
  .reminder .title{font-weight:600}
  .reminder .cadence{font-family:'DM Mono',monospace;font-size:13px;color:var(--alarm)}
  .reminder a.cadence{text-decoration:underline;text-underline-offset:3px}
  .reminder a.cadence:hover{color:var(--gold-bright)}

  /* Two-column body: story spine on the left, everything else on the right. */
  .cols{display:grid;grid-template-columns:290px minmax(0,1fr);gap:26px;margin-top:44px;align-items:start}
  .cols.nostory{grid-template-columns:minmax(0,1fr)}   /* nothing in STORY_GROUP → one column */

  h2{
    font-family:Karla,sans-serif;font-weight:600;font-size:12px;
    letter-spacing:.22em;text-transform:uppercase;color:var(--dim);
    margin:0 0 4px;display:flex;align-items:center;gap:12px;
  }
  h2 .count{font-family:'DM Mono',monospace;font-size:12px;letter-spacing:0;opacity:.75}
  .colnote{color:var(--dim);font-size:13.5px;margin:0 0 14px;font-family:'DM Mono',monospace}

  .card{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:2px 20px 8px;margin-bottom:12px;
  }
  .card > header{
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
    padding:15px 0 9px;flex-wrap:wrap;
  }
  .card > header .name{font-weight:600;font-size:16px}
  .card > header .when{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--dim);white-space:nowrap}
  .card > header .when.hot{color:var(--alarm)}

  ul{list-style:none;margin:0;padding:0}
  li.task{border-top:1px solid var(--line);display:flex;gap:14px;padding:13px 0;align-items:flex-start}
  li.task input{
    appearance:none;-webkit-appearance:none;flex:0 0 auto;
    width:21px;height:21px;margin:2px 0 0;border:1px solid var(--gold-dim);
    background:transparent;cursor:pointer;border-radius:5px;transition:background .15s ease;
  }
  li.task input:hover{border-color:var(--gold)}
  li.task input:checked{background:var(--gold);border-color:var(--gold)}
  li.task input:checked::after{content:"✓";display:block;color:var(--bronze-deep);font-size:14px;line-height:19px;text-align:center;font-weight:700}
  .body{flex:1;min-width:0}
  .title{font-weight:600;font-size:15.5px}
  .note{color:var(--dim);font-size:14px;margin-top:3px}
  .meta{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--dim);margin-top:6px}
  .meta .hot{color:var(--alarm)}
  li.task.done .title,li.task.done .note{opacity:.38;text-decoration:line-through}
  li.task.done .meta{opacity:.38}
  li.task.locked .title{color:var(--dim)}
  li.task.locked input:disabled{cursor:not-allowed;opacity:.4;border-style:dashed;border-color:var(--alarm)}
  li.task.locked input:disabled:hover{border-color:var(--alarm)}

  /* Counters — for open-ended grinds where one checkbox says nothing. */
  .count{display:flex;align-items:center;gap:10px;margin-top:8px;flex-wrap:wrap}
  .count input[type=number]{
    appearance:textfield;-moz-appearance:textfield;width:76px;
    font:500 14px 'DM Mono',monospace;color:var(--cream);background:rgba(0,0,0,.18);
    border:1px solid var(--line);border-radius:7px;padding:5px 8px;
  }
  .count input[type=number]::-webkit-inner-spin-button,
  .count input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
  .count input[type=number]:focus{border-color:var(--gold)}
  .count .of{font-family:'DM Mono',monospace;font-size:13px;color:var(--dim)}
  .count .bar{flex:1 1 120px;height:3px;background:rgba(211,175,101,.16);border-radius:2px;overflow:hidden;min-width:80px}
  .count .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright))}
  li.task.done .count{opacity:.38}

  /* Folder tabs inside a card: a strip of tabs sitting on a bordered pane, the
     active tab fused to the pane so they read as one sheet. */
  /* Tabbed cards: a vertical rail of tabs beside the pane on wide screens, the
     active one fused into the pane's left edge. Under 700px the same sections
     become an accordion (see card()). */
  .tabbed{margin:8px 0 10px;display:grid;grid-template-columns:230px minmax(0,1fr);align-items:start}
  .rail{display:flex;flex-direction:column;gap:3px;padding:10px 0 10px 4px;position:relative;z-index:1}
  .rail button{
    font:600 13.5px Karla,sans-serif;text-align:left;background:rgba(0,0,0,.18);color:var(--dim);
    border:1px solid var(--line);border-right:1px solid var(--gold);border-radius:10px 0 0 10px;
    padding:9px 12px 9px 14px;margin-right:-1px;cursor:pointer;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .rail button:hover{color:var(--gold-bright);border-color:var(--gold)}
  .rail button[aria-selected=true]{
    color:var(--cream);background:var(--pane);border-color:var(--gold);border-right-color:var(--pane);
  }
  .rail button small{font:400 11.5px 'DM Mono',monospace;opacity:.75;white-space:nowrap}
  .tabpane{border:1px solid var(--gold);border-radius:0 10px 10px 10px;background:var(--pane);padding:4px 18px 8px;min-height:100%}
  .tabpane li.task:first-child{border-top:0}
  .tabpane .items ul{padding-left:30px}   /* quests sit visibly under their area */

  /* Accordion (narrow screens). */
  .acc{margin:8px 0 10px;border:1px solid var(--gold);border-radius:10px;overflow:hidden}
  .acc > section + section{border-top:1px solid var(--line)}
  .acc > section > button{
    width:100%;font:600 14px Karla,sans-serif;text-align:left;background:rgba(0,0,0,.18);color:var(--dim);
    border:0;padding:11px 16px;cursor:pointer;display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .acc > section > button:hover{color:var(--gold-bright)}
  .acc > section[open] > button{color:var(--cream);background:var(--pane)}
  .acc > section > button small{font:400 11.5px 'DM Mono',monospace;opacity:.75}
  .acc > section > .accbody{background:var(--pane);padding:0 16px 8px}
  .acc .items ul{padding-left:22px}
  .tabbar{display:flex;justify-content:flex-end;padding:8px 0 2px}
  .tabbar + ul li.task:first-child{border-top:0}
  .pageall{margin-left:auto;letter-spacing:0;text-transform:none}
  .checkall{color:var(--dim)}
  .checkall:hover{color:var(--gold-bright)}
  .tabpane li.task:first-child{border-top:0}
  .tabpane .items ul{padding-left:30px}   /* quests sit visibly under their area */

  /* Item lists — sub-checkboxes behind a disclosure. */
  .items{margin-top:6px}
  .items > .itemhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .items .bar{flex:1 1 120px;height:3px;background:rgba(211,175,101,.16);border-radius:2px;overflow:hidden;min-width:80px}
  .items .bar > i{display:block;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--gold-bright))}
  .items .of{font-family:'DM Mono',monospace;font-size:13px;color:var(--dim)}
  .items .disclose{margin-left:0}
  .items ul{margin:8px 0 2px;columns:2 220px;column-gap:28px}
  .items li{
    break-inside:avoid;display:flex;gap:9px;align-items:flex-start;
    font-size:14px;padding:4px 0;color:var(--cream);border:0;
  }
  .items li input{
    appearance:none;-webkit-appearance:none;flex:0 0 auto;width:16px;height:16px;margin:3px 0 0;
    border:1px solid var(--gold-dim);border-radius:4px;background:transparent;cursor:pointer;
  }
  .items li input:hover{border-color:var(--gold)}
  .items li input:checked{background:var(--gold);border-color:var(--gold)}
  .items li input:checked::after{content:"✓";display:block;color:var(--bronze-deep);font-size:11px;line-height:14px;text-align:center;font-weight:700}
  .items li.on span{opacity:.45;text-decoration:line-through}
  li.task.done .items{opacity:.38}

  .maplink{
    font:600 12.5px Karla,sans-serif;color:var(--gold);text-decoration:none;
    border:1px solid var(--line);border-radius:999px;padding:2px 10px;white-space:nowrap;
  }
  .maplink:hover{color:var(--gold-bright);border-color:var(--gold)}

  /* Permanent goals — no deadline, so no urgency colouring anywhere on the card. */
  .card.soft > header .when{color:var(--dim);opacity:.8}
  .card.soft{border-style:dashed}

  /* Collapsed lock line — replaces a run of locked rows with one summary. */
  .locked-line{
    border-top:1px solid var(--line);padding:12px 0 6px;
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    font-size:14px;color:var(--dim);
  }
  .locked-line .why{color:var(--alarm)}
  .disclose{
    font:600 13px Karla,sans-serif;background:none;border:0;padding:0;margin-left:auto;
    color:var(--gold);cursor:pointer;text-decoration:underline;text-underline-offset:3px;
  }
  .disclose:hover{color:var(--gold-bright)}

  /* A group where nothing is actionable yet doesn't earn a card. */
  .pending{
    display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;
    padding:12px 20px;border:1px dashed var(--line);border-radius:10px;
    margin-bottom:10px;font-size:14px;color:var(--dim);
  }
  .pending .name{font-weight:600;color:var(--cream);font-size:15px}
  .pending .why{color:var(--alarm)}

  /* Story spine */
  .spine{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:2px 20px 10px}
  .spine li.task:first-child{border-top:0}
  .spine .opens{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--gold);margin-top:4px}
  .spine .opens.was{color:var(--dim)}
  .spine li.task.locked .opens{color:var(--dim)}
  .spinefoot{color:var(--dim);font-size:13.5px;margin:0 0 9px;line-height:1.5}

  /* Expired */
  .card.weekly{border-left:3px solid var(--gold)}
  .card .cardright{display:flex;gap:14px;align-items:baseline;flex-wrap:wrap;margin-left:auto}
  .card .cardright .of{font-family:'DM Mono',monospace;font-size:12.5px;color:var(--dim)}
  .card .cardright .disclose{margin-left:0}
  .card.closed{padding-bottom:2px}
  .card.closed > header{padding-bottom:13px}
  .card.weekly li.task:first-child{border-top:0}
  .optional{
    font-family:'DM Mono',monospace;font-size:11.5px;font-weight:400;
    color:var(--dim);margin-left:9px;letter-spacing:.04em;
  }

  .expired{margin-top:30px;border-top:1px solid var(--line);padding-top:10px}
  .expired > button{
    font:600 13px Karla,sans-serif;background:none;border:0;padding:8px 0;
    color:var(--dim);cursor:pointer;display:flex;gap:9px;align-items:center;width:100%;
  }
  .expired > button:hover{color:var(--gold)}
  .expired ul{padding-bottom:8px}
  .expired li.task{opacity:.5}

  .toolbar{display:flex;gap:14px;flex-wrap:wrap;margin-top:44px;padding-top:24px;border-top:1px solid var(--line)}
  button.action{
    font:600 14px Karla,sans-serif;background:transparent;color:var(--dim);
    border:1px solid var(--line);border-radius:999px;padding:9px 20px;cursor:pointer;
  }
  button.action:hover{color:var(--gold-bright);border-color:var(--gold)}
  .saved{color:var(--dim);font-size:13px;font-family:'DM Mono',monospace;align-self:center}
  footer{margin-top:40px;color:var(--dim);font-size:14px}

  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
  @media (max-width:860px){
    .cols{grid-template-columns:1fr;gap:34px}
    body{padding:0 18px 80px}
  }
  @media (max-width:520px){ .big{font-size:44px} .status{gap:20px 28px;padding:22px} }
</style>
</head>
<body>
<div class="wrap">

  <a class="back" href="index.html">← FaetoPlay</a>
  <h1 id="bannerName">Banner Checklist</h1>
  <p class="sub" id="bannerDates"></p>

  <div class="status">
    <div class="big" id="daysLeft">—<small id="daysLabel">Days left in banner</small></div>
    <div class="stat" id="endsOn">—<small id="endLabel">Banner ends</small></div>
    <div class="stat" id="doneCount">—<small>Tasks done</small></div>
    <div class="track"><i id="track" style="width:0%"></i></div>
  </div>

  <div id="reminders"></div>

  <div class="cols">
    <section id="storyCol"></section>
    <section id="groupCol"></section>
  </div>

  <div id="expired"></div>

  <div class="toolbar">
    <button class="action" id="uncheck">Clear all checkmarks</button>
    <span class="saved">Progress saves in this browser only.</span>
  </div>

  <footer>FaetoPlay · Not affiliated with Papergames or Infold Games.</footer>
</div>

<script>
/* ============================================================
   EDIT EVERYTHING BETWEEN THE ==== LINES. Nothing below needs
   touching. See PLANNING-README.md for the full field guide.
   ============================================================ */

const BANNER = {
  id:    "2026-11-before-3-0",         // change this every banner; it resets checkmarks
  name:  "Before 3.0",
  start: "2026-10-29T22:00-05:00",     // 2.11 went live Oct 29, 20:00 UTC-7 (-05:00 = EST, in force since Nov 1)
  end:   "2026-11-26T12:30-05:00",     // 3.0 maintenance: Nov 26, 10:30 UTC-7, per the 2.11 notice (moved earlier from 12:50)
  resetNote: "Daily reset 7:00 AM ET", // set to "" to hide
  // Optional wording. Leave these out and the page goes back to banner language.
  kind:      "before-3.0 checklist",   // sits in the subtitle: "Infinity Nikki <kind> · dates"
  daysLabel: "Days until 3.0",
  endLabel:  "3.0 maintenance starts"
};

/* The official interactive map (Pear-Pal). Linked from the pinned note and the Map
   pills on the permanent rows. */
const MAP = "http://pearpal.infoldgames.com/tools/map?language=en&lat=331495.47&lng=754601.11&markerType=0123&selectedCatalogIds=244%2C248&worldId=1.1&zoom=4";

/* The group whose tasks run down the left column as a sequence rather than a
   set. One per banner — the main story chain. Every other group is a card. */
const STORY_GROUP = "Main story";

/* Cards listed here render first, in this order, ahead of the dated ones. The point
   of this run is 100% Itzaland before 3.0, so the quest cards lead. */
const PINNED_GROUPS = ["Random quests", "World quests"];
const STORY_LEDE  = "Do these in order. 3.0's story will pick up where this ends.";

/* Task fields:
     title    (required) what to do
     group    (required) which card it appears under. Use the in-game tile name so
                         the page matches what the reader is looking at. Set it to
                         STORY_GROUP for the main story chain.
     startBy  (required) last day-count-remaining you can still start it.
                         30 = "start no later than 30 days remaining".
                         999 = start day one.  0 = any time before the deadline.
     type     "every" | "mid" | "unique"   -- default "every". Only "mid" shows a badge.
     note     one line of context
     id       short handle so other tasks can point at this one, e.g. "ch11"
     short    abbreviated label used when other tasks name this one as a blocker,
              e.g. "Ch. 11". Falls back to the full title. Worth setting on
              anything that gates something else.
     gate     prerequisite text, shown on the expanded row.
     requires the id of the task that satisfies the gate. When that task is checked
              off, the row unlocks on its own, without a reload.
     deadline optional YYYY-MM-DDTHH:MM±HH:MM if this task ends before the banner does
     unlockDay optional event-day number (1-based). The task stays locked and its box
              stays disabled until that day has arrived, worked out from the banner
              start and the 7 AM ET reset. Combines with gate/requires — both must
              clear before the box becomes clickable.
     soft     true for a permanent goal with no deadline — map cleanup, dew farming,
              anything that will still be there after the update. Soft tasks never
              expire, and their cards sort after
              every dated card. startBy is ignored on them.
     target   a number, for grinds. Adds a counter under the row: type what you've
              collected and a bar fills toward the target. Saved with the checkmarks.
              The checkbox stays manual — hitting the target doesn't tick it, since
              "done enough" is a judgment call.
     link     optional {href, label}. Small pill link on the row, e.g. to the map.
     tab      optional label. When any row in a card has one, the card grows a tab
              strip and shows only the rows of the active tab. Tabs appear in the
              order their first row is written; the chosen tab is remembered per
              browser. Rows without a tab go under the first one.
     items    optional array of names. The row grows a "Show N" disclosure with one
              small checkbox per name, saved alongside the checkmarks, and a bar that
              fills as they're ticked. The row's own checkbox stays manual.
*/
/* Pinned reminders. These are NOT tasks — no checkbox, no saved state, and they
   don't count toward the tally. They render above everything and stay put.
     title    (required) what to remember
     cadence  (required) how often, shown in parentheses beside the title
     href     optional link; the cadence text becomes the link  */
const REMINDERS = [
  { title:"Before maintenance: claim any Deep Echoes rewards and spend leftover event currencies — Wish Snowflakes especially. Cherished Rose converts to Resonite Crystals 1:1 on its own.",
    cadence:"by 12:29 PM ET on Nov 26" },
  { title:"Spend your Dark Realm currency — it stops being useful in 3.0.",   // Kahako, Nov 5
    cadence:"before Nov 26" },
  { title:"Missing chests, Dews or Whimstars? The official interactive map shows what's left in each area.",
    cadence:"open the map", href:MAP }
];

/* Weekly tasks. Checkbox like a normal task, but the tick is stored against the
   current week and clears itself at the Monday 7 AM ET reset — no need to come back
   and un-tick four boxes. They're outside the banner tally, since "done" for them
   means done this week, not done for good. Most of these carry over between banners
   untouched; see NEXT-BANNER.md.
     title    (required)
     note     one line of context
     optional set true for anything you can skip without losing progress. Optional
              tasks are labelled. */
const WEEKLY = [
  { title:"Mira Crown — Arena",
    note:"Materials for the Miracle outfit come from here." },

  { title:"Starlit Pursuit",
    optional:true },

  { title:"Home Island tasks",
    note:"2,000 points is the weekly cap." },

  { title:"Mira Journey",
    note:"8,000 points is the weekly cap." }
];

/* Sources for this list, so the sourcing rule holds:
     [2.11]  Oct 29 "Version 2.11 Update Notice", infinitynikki.infoldgames.com/en/news/631
             — every end time below, the 3.0 maintenance move, Snowgrove, Mira Building
             phases, Dreamland Showcase, Starlit Shop tabs, Pinnacle Phase II.
     [2.10]  Sept 23 "Version 2.10 Update Notice", .../news/595 — the Little Prince
             planets being a limited-time area that closes with 2.11.
     [2.8]   July 16 "Version 2.8 Update Notice", .../news/560 — how Dews and Whimstars
             turn into outfits (Existence Paradox, Heart of Infinity sketches).
     [map]   interactivemap.app/infinity-nikki — the marker counts on the targets.
             Those are map-wide totals, not "what you're missing"; set them to your own.
   Times: the game posts UTC-7. Eastern is +2h in November (EST). 10:29 UTC-7 = 12:29 PM ET.

/* ============================================================ */

const DAY = 86400000;
const now = new Date();
const bannerEnd = new Date(BANNER.end);
const bannerStart = new Date(BANNER.start);

const daysUntil = d => (new Date(d) - now) / DAY;
const fmt = d => new Date(d).toLocaleDateString(undefined,{month:"short",day:"numeric"});

const bannerDaysLeft = Math.max(0, daysUntil(bannerEnd));
const totalDays = Math.max(1, (bannerEnd - bannerStart) / DAY);

/* --- event day counter ---
   Day 1 starts with the banner; every later day starts at the next 7 AM ET reset, not
   24h after launch. 2.11 opened at 10 PM ET, so Day 1 is a short one.
   The ET offset is read off BANNER.end (-05:00 in winter, -04:00 in summer), so the
   reset math follows whatever offset the dates above are written in. It still won't
   track a DST change that falls inside one banner; that costs an hour for a day or two. */
const ET_OFFSET = (() => {
  const m = /([+-])(\d\d):?(\d\d)$/.exec(BANNER.end);
  return m ? (m[1] === "-" ? -1 : 1) * (+m[2] * 3600000 + +m[3] * 60000) : -5 * 3600000;
})();
function eventDayStart(n){
  if (n <= 1) return bannerStart;
  const etMs = +bannerStart + ET_OFFSET;                 // banner start on an ET clock
  let reset = Math.floor(etMs / DAY) * DAY + 7 * 3600000; // 7 AM ET that same ET day
  if (reset <= etMs) reset += DAY;                        // already past it → next one
  return new Date(reset + (n - 2) * DAY - ET_OFFSET);     // n=2 is the first reset
}
let eventDay = 1;
while (eventDayStart(eventDay + 1) <= now) eventDay++;

/* --- weekly reset ---
   Monday 7 AM ET. Same hardcoded ET offset as above, so it needs the same DST edit. */
function weekStartAt(at){
  const etMs = +at + ET_OFFSET;                       // that instant on an ET clock
  const dow  = new Date(etMs).getUTCDay();            // 0 Sun … 1 Mon, read in ET
  const back = (dow + 6) % 7;                         // days since Monday
  let ms = (Math.floor(etMs / DAY) - back) * DAY + 7 * 3600000;
  if (ms > etMs) ms -= 7 * DAY;                       // before this week's reset
  return ms - ET_OFFSET;                              // back to a real instant
}
const weekStart = weekStartAt(now);
const weekEnd   = weekStart + 7 * DAY;
const weekId    = new Date(weekStart + ET_OFFSET).toISOString().slice(0,10);
const weekKey   = t => "weekly:" + t.title + "@" + weekId;
const hoursToReset = (weekEnd - now) / 3600000;

document.title = BANNER.name + " Checklist · FaetoPlay";
document.getElementById("bannerName").textContent = BANNER.name;
document.getElementById("bannerDates").textContent =
  "Infinity Nikki " + (BANNER.kind || "banner checklist") + " · " + fmt(bannerStart) + " – " + fmt(bannerEnd) +
  " · " + Math.round(totalDays) + " days total" +
  (BANNER.resetNote ? " · " + BANNER.resetNote : "");
if (BANNER.daysLabel) document.getElementById("daysLabel").textContent = BANNER.daysLabel;
if (BANNER.endLabel)  document.getElementById("endLabel").textContent  = BANNER.endLabel;
document.getElementById("daysLeft").firstChild.textContent = Math.floor(bannerDaysLeft);
document.getElementById("endsOn").firstChild.textContent =
  bannerEnd.toLocaleDateString(undefined,{month:"short",day:"numeric"}) + ", " +
  bannerEnd.toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
document.getElementById("track").style.width =
  Math.min(100, Math.max(0, (1 - bannerDaysLeft/totalDays) * 100)) + "%";

/* --- saved state --- */
const KEY = "faetoplay.nikki." + BANNER.id;
let done = {};
try { done = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){ done = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(done)); } catch(e){} };

// Last week's weekly ticks are dead weight — drop them rather than let them pile up.
let pruned = false;
Object.keys(done).forEach(k => {
  if (k.indexOf("weekly:") === 0 && k.slice(k.lastIndexOf("@") + 1) !== weekId){
    delete done[k]; pruned = true;
  }
});
if (pruned) save();

/* --- urgency ---
   slack = days left on this task's deadline − the runway it needs.
   It no longer drives page order on its own; it drives the per-card marker and
   the tiebreak between cards that share a deadline. */
const enriched = TASKS.map((t,i) => {
  const left = t.deadline ? daysUntil(t.deadline) : bannerDaysLeft;
  const startBy = t.startBy ?? 0;
  // Soft tasks have no clock: an infinite deadline sorts their cards last, and
  // they can't expire.
  if (t.soft) return {...t, i, left, startBy:0, slack:Infinity, deadlineAt:Infinity, expired:false};
  return {...t, i, left, startBy, slack: left - startBy,
          deadlineAt: t.deadline ? new Date(t.deadline) : bannerEnd,
          expired: left <= 0};
});
const countKey = t => "count:" + t.title;
const NARROW = matchMedia("(max-width: 700px)");
NARROW.addEventListener ? NARROW.addEventListener("change", () => renderAll()) : NARROW.addListener(() => renderAll());
const UIKEY = KEY + ".ui";
let ui = {};
try { ui = JSON.parse(localStorage.getItem(UIKEY)) || {}; } catch(e){ ui = {}; }
const saveUI = () => { try { localStorage.setItem(UIKEY, JSON.stringify(ui)); } catch(e){} };
const itemKey  = (t, name) => "sub:" + t.title + "|" + name;

const byId = id => TASKS.find(x => x.id === id);
const label = t => t && (t.short || t.title);

/* --- locking --- */
const dayReached = t => !t.unlockDay || eventDay >= t.unlockDay;

function isUnlocked(t){
  if (!dayReached(t)) return false;
  if (!t.gate) return true;
  if (!t.requires) return false;
  const pre = byId(t.requires);
  return !!(pre && done[pre.title]);
}

/* Two kinds of blocker, worded differently on purpose: a day lock is a promise
   about the calendar, a prerequisite is an instruction. A task can carry both;
   the prerequisite is the one worth naming, since it's the one you can act on. */
function gateOpen(t){ return !t.gate || isUnlocked({...t, unlockDay:null}); }

/* Collapses a run of locked tasks into as few lines as possible: one per
   prerequisite, plus one for everything waiting only on the calendar. */
function lockSummary(hidden){
  const out = [], byGate = {}, dayOnly = [];
  hidden.forEach(t => {
    if (!gateOpen(t)){
      const k = "after " + (label(byId(t.requires)) || t.gate);
      (byGate[k] = byGate[k] || []).push(t);
    } else dayOnly.push(t);
  });
  Object.keys(byGate).forEach(k => out.push({ label:k, tasks:byGate[k] }));
  if (dayOnly.length){
    const days = [...new Set(dayOnly.map(t => fmt(eventDayStart(t.unlockDay))))];
    out.push({
      label: "open" + (dayOnly.length === 1 ? "s " : " ") +
             (days.length <= 2 ? days.join(" and ") : days[0] + " – " + days[days.length-1]),
      tasks: dayOnly
    });
  }
  return out;
}

function lockDetail(t){
  const parts = [];
  if (!dayReached(t))
    parts.push("event Day " + t.unlockDay + ", opening " + fmt(eventDayStart(t.unlockDay)));
  if (t.gate) parts.push(t.gate);
  return parts.join(" · ");
}

let rendered = [];

/* ============ rows ============ */

function row(t, opts){
  opts = opts || {};
  const open = isUnlocked(t);
  const li = document.createElement("li");
  li.className = "task" + (done[t.title] ? " done" : "") +
                 ((t.gate || t.unlockDay) && !open ? " locked" : "");
  li._task = t;

  const box = document.createElement("input");
  box.type = "checkbox";
  box.checked = !!done[t.title];
  box.setAttribute("aria-label", t.title);
  // Never disable a box that's already ticked — that would strand the checkmark.
  box.disabled = (opts.frozen || !open) && !box.checked;
  if (!open) box.title = "Locked until: " + lockDetail(t);
  box.onchange = () => { done[t.title] = box.checked; save(); renderAll(); };

  const body = document.createElement("div");
  body.className = "body";

  const title = document.createElement("div");
  title.className = "title";
  title.textContent = t.title;
  body.appendChild(title);

  if (t.note){
    const n = document.createElement("div");
    n.className = "note"; n.textContent = t.note;
    body.appendChild(n);
  }
  if (opts.opens){
    const o = document.createElement("div");
    o.className = "opens" + (done[t.title] ? " was" : "");
    o.textContent = opts.opens;
    body.appendChild(o);
  }
  if ((t.gate || t.unlockDay) && !open){
    const g = document.createElement("div");
    g.className = "note"; g.textContent = "Needs first: " + lockDetail(t);
    body.appendChild(g);
  }
  if (t.target){
    // Counter: a number box, "/ target", and a bar. Typing saves on the spot.
    const wrap = document.createElement("div");
    wrap.className = "count";
    const num = document.createElement("input");
    num.type = "number"; num.min = 0; num.max = t.target; num.step = 1;
    num.inputMode = "numeric";
    num.value = Math.max(0, +done[countKey(t)] || 0);
    num.setAttribute("aria-label", t.title + " collected, out of " + t.target);
    const of = document.createElement("span");
    of.className = "of"; of.textContent = "/ " + t.target;
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    bar.appendChild(fill);
    const paint = () => {
      const v = Math.max(0, Math.min(t.target, Math.floor(+num.value) || 0));
      fill.style.width = (v / t.target * 100) + "%";
    };
    paint();
    num.oninput = () => { paint(); };
    num.onchange = () => {
      const v = Math.max(0, Math.min(t.target, Math.floor(+num.value) || 0));
      num.value = v; done[countKey(t)] = v; save(); paint();
    };
    wrap.append(num, of, bar);
    body.appendChild(wrap);
  }

  if (t.items && t.items.length){
    // Item list: "k / N" + bar, a Show/Hide button, and the names behind it.
    // Ticking a name only saves that name; the row's own box is untouched.
    const wrap = document.createElement("div");
    wrap.className = "items";
    const head = document.createElement("div");
    head.className = "itemhead";
    const of = document.createElement("span");
    of.className = "of";
    const bar = document.createElement("div");
    bar.className = "bar";
    const fill = document.createElement("i");
    bar.appendChild(fill);
    const list = document.createElement("ul");
    // The first list in a pane starts open; after that, whatever you last chose.
    const openPref = (ui.open || {})[t.title];
    list.hidden = openPref === undefined ? !opts.firstItems : !openPref;
    const paint = () => {
      const k = t.items.filter(n => done[itemKey(t, n)]).length;
      of.textContent = k + " / " + t.items.length;
      fill.style.width = (k / t.items.length * 100) + "%";
    };
    t.items.forEach(n => {
      const li = document.createElement("li");
      const box = document.createElement("input");
      box.type = "checkbox";
      box.checked = !!done[itemKey(t, n)];
      box.setAttribute("aria-label", n);
      li.className = box.checked ? "on" : "";
      box.onchange = () => {
        done[itemKey(t, n)] = box.checked; save();
        li.className = box.checked ? "on" : ""; paint();
      };
      const txt = document.createElement("span");
      txt.textContent = n;
      li.append(box, txt);
      list.appendChild(li);
    });
    paint();
    const dis = discloser(list, t.items.length);
    const flip = dis.onclick;
    dis.onclick = () => { flip(); (ui.open = ui.open || {})[t.title] = !list.hidden; saveUI(); };
    head.append(of, bar, dis);
    wrap.append(head, list);
    body.appendChild(wrap);
  }

  if (!opts.hideMeta){
    const meta = document.createElement("div");
    meta.className = "meta";
    if (t.soft){
      if (!(t.link && t.link.href)) { li.append(box, body); return li; }
    } else {
      const startTxt = t.startBy >= 999 ? "start day 1" : "start by " + t.startBy + "d remaining";
      meta.innerHTML =
        '<span' + (t.slack <= 0 ? ' class="hot"' : '') + '>' + startTxt + '</span>' +
        ' · <span>' + Math.floor(Math.max(0,t.left)) + 'd left</span>' +
        (t.deadline ? ' <span>(ends ' + fmt(t.deadline) + ')</span>' : '');
    }
    if (t.link && t.link.href){
      const a = document.createElement("a");
      a.className = "maplink"; a.href = t.link.href;
      a.textContent = (t.link.label || "Link") + " ↗";
      if (/^https?:/.test(t.link.href)){ a.target = "_blank"; a.rel = "noopener"; }
      meta.append("  ", a);
    }
    body.appendChild(meta);
  }

  li.append(box, body);
  return li;
}

/* ============ left column: the story spine ============ */

const storyTasks = enriched.filter(t => t.group === STORY_GROUP);
// How many non-story tasks each chapter releases. This is the reason to do it.
const opensCount = {};
storyTasks.forEach(s => {
  opensCount[s.id] = TASKS.filter(x => x.group !== STORY_GROUP && x.requires === s.id).length;
});

function opensText(t){
  const n = opensCount[t.id] || 0;
  const finished = !!done[t.title];
  const nextUp = !finished && storyTasks.every(s => s.i >= t.i || done[s.title]);
  const bits = [];
  if (nextUp) bits.push("next up");
  if (n) bits.push((finished ? "opened " : "opens ") + n + (n === 1 ? " task" : " tasks"));
  return bits.join(" · ");
}

function renderStory(){
  const col = document.getElementById("storyCol");
  col.textContent = "";
  document.querySelector(".cols").classList.toggle("nostory", !storyTasks.length);
  col.hidden = !storyTasks.length;
  if (!storyTasks.length) return;

  const n = storyTasks.filter(t => done[t.title]).length;
  const h = document.createElement("h2");
  h.innerHTML = STORY_GROUP + ' <span class="count">' + n + " / " + storyTasks.length + '</span>';
  col.appendChild(h);

  const lede = document.createElement("p");
  lede.className = "spinefoot";
  lede.textContent = STORY_LEDE;
  col.appendChild(lede);

  const next = storyTasks.find(t => !done[t.title]);
  const note = document.createElement("p");
  note.className = "colnote";
  note.textContent = !next ? "All chapters done."
    : opensCount[next.id] ? label(next) + " next — opens " + opensCount[next.id] + " tasks"
    : label(next) + " next";
  col.appendChild(note);

  const ul = document.createElement("ul");
  ul.className = "spine";
  storyTasks.forEach(t => ul.appendChild(row(t, {opens:opensText(t), hideMeta:true})));
  col.appendChild(ul);
}

/* ============ right column: one card per event ============ */

const otherTasks = enriched.filter(t => t.group !== STORY_GROUP);
const groupOrder = [];
const groupMap = {};
otherTasks.forEach(t => {
  if (!groupMap[t.group]){ groupMap[t.group] = []; groupOrder.push(t.group); }
  groupMap[t.group].push(t);
});

/* Cards sort by whichever deadline lands first. Most groups inherit the banner end,
   so they tie — the tiebreak is the most urgent task inside, which is what pushes a
   long grind like the Starlit Shop above a one-sitting task that shares its date. */
function buildGroups(){
  return groupOrder.map(name => {
    const all = groupMap[name];
    const live = all.filter(t => !t.expired);
    const basis = live.length ? live : all;
    return {
      name, all, live,
      soft: all.every(t => t.soft),
      visible: live.filter(t => isUnlocked(t) || done[t.title]),
      hidden:  live.filter(t => !isUnlocked(t) && !done[t.title]),
      deadlineAt: Math.min(...basis.map(t => +t.deadlineAt)),
      slack: Math.min(...basis.map(t => t.slack)),
      order: groupOrder.indexOf(name)
    };
  }).filter(g => g.live.length)
    // Infinity − Infinity is NaN, which would scramble the sort, so compare in steps.
    // Soft cards share an infinite deadline and fall back to the order they're written in.
    .sort((a,b) => cmp(a.deadlineAt, b.deadlineAt) || cmp(a.slack, b.slack) || a.order - b.order);
}
function cmp(a, b){ return a === b ? 0 : a < b ? -1 : 1; }

/* Check-all. A row counts as "checkable" if its box is open or already ticked;
   locked rows are skipped on the way up and left alone on the way down. Items
   follow their row. Returns true when nothing checkable is still unticked. */
function allDone(tasks){
  return tasks.every(t =>
    (!isUnlocked(t) && !done[t.title] ? true : !!done[t.title]) &&
    (t.items || []).every(n => done[itemKey(t, n)]));
}
function setAll(tasks, on){
  tasks.forEach(t => {
    if (on && !isUnlocked(t) && !done[t.title]) return;
    done[t.title] = on;
    (t.items || []).forEach(n => { done[itemKey(t, n)] = on; });
  });
  save(); renderAll();
}
function checkAllButton(tasks, label){
  const b = document.createElement("button");
  b.type = "button";
  b.className = "disclose checkall";
  const full = allDone(tasks);
  b.textContent = (full ? "Uncheck all" : "Check all") + (label ? " · " + label : "");
  b.onclick = () => setAll(tasks, !full);
  return b;
}

/* ============ weekly ============
   Pinned above the event cards. It isn't sorted with them: its deadline is the same
   every week, and it's the thing most likely to be why you opened the page today. */

function weeklyDone(t){ return !!done[weekKey(t)]; }

function renderWeekly(col){
  if (!WEEKLY.length) return;
  const sec = document.createElement("section");
  sec.className = "card weekly";

  const head = document.createElement("header");
  const name = document.createElement("span");
  name.className = "name";
  name.textContent = "This week";
  const when = document.createElement("span");
  when.className = "when" + (hoursToReset <= 24 ? " hot" : "");
  // Days-and-hours rather than a rounded day count: over a 7-day horizon the
  // rounding is the difference between "6d left" and "nearly a full week left".
  when.textContent = "resets Mon 7 AM · " + (hoursToReset < 24
    ? Math.max(0, Math.round(hoursToReset)) + "h left"
    : Math.floor(hoursToReset / 24) + "d " + Math.floor(hoursToReset % 24) + "h left");
  // Dropdown: closed by default, remembered per browser. The header carries a
  // done count so a closed card still says whether the week's work is finished.
  const open = !!ui.weeklyOpen;
  const nDone = WEEKLY.filter(weeklyDone).length;
  const tally = document.createElement("span");
  tally.className = "of";
  tally.textContent = nDone + " / " + WEEKLY.length;
  const ul = document.createElement("ul");
  ul.hidden = !open;
  const btn = discloser(ul);
  btn.onclick = () => { ui.weeklyOpen = ul.hidden; saveUI(); renderAll(); };
  const wAll = WEEKLY.every(weeklyDone);
  const wBtn = document.createElement("button");
  wBtn.type = "button"; wBtn.className = "disclose checkall";
  wBtn.textContent = wAll ? "Uncheck all" : "Check all";
  wBtn.onclick = () => { WEEKLY.forEach(t => { done[weekKey(t)] = !wAll; }); save(); renderAll(); };
  const right = document.createElement("span");
  right.className = "cardright";
  right.append(tally, when, wBtn, btn);
  head.append(name, right);
  sec.appendChild(head);
  sec.classList.toggle("closed", !open);

  WEEKLY.forEach(t => {
    const li = document.createElement("li");
    li.className = "task" + (weeklyDone(t) ? " done" : "");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = weeklyDone(t);
    box.setAttribute("aria-label", t.title + " (this week)");
    box.onchange = () => { done[weekKey(t)] = box.checked; save(); renderAll(); };

    const body = document.createElement("div");
    body.className = "body";
    const title = document.createElement("div");
    title.className = "title";
    title.textContent = t.title;
    if (t.optional){
      const tag = document.createElement("span");
      tag.className = "optional";
      tag.textContent = "optional";
      title.appendChild(tag);
    }
    body.appendChild(title);
    if (t.note){
      const n = document.createElement("div");
      n.className = "note"; n.textContent = t.note;
      body.appendChild(n);
    }

    li.append(box, body);
    ul.appendChild(li);
  });
  sec.appendChild(ul);
  col.appendChild(sec);
}

function renderGroups(){
  const col = document.getElementById("groupCol");
  col.textContent = "";
  const groups = buildGroups();
  // A group with nothing actionable doesn't earn a card; it drops to a single line
  // at the bottom so the top of the column stays things you can actually do.
  const active  = groups.filter(g => g.visible.length);
  const pending = groups.filter(g => !g.visible.length);
  const live = otherTasks.filter(t => !t.expired);

  const h = document.createElement("h2");
  h.innerHTML = 'Everything else <span class="count">' +
    live.filter(t => done[t.title]).length + " / " + live.length + '</span>';
  // Page-wide Show all / Hide all: flips every card, the weekly one included.
  const names = groups.map(g => g.name);
  const anyOpen = (WEEKLY.length && ui.weeklyOpen) || names.some(n => !((ui.closed || {})[n]));
  const all = document.createElement("button");
  all.type = "button"; all.className = "disclose pageall";
  all.textContent = anyOpen ? "Hide all" : "Show all";
  all.onclick = () => {
    ui.closed = {}; names.forEach(n => { ui.closed[n] = anyOpen; });
    ui.weeklyOpen = !anyOpen; saveUI(); renderAll();
  };
  h.appendChild(all);
  col.appendChild(h);

  const weeklyLeft = WEEKLY.filter(t => !weeklyDone(t) && !t.optional).length;
  const note = document.createElement("p");
  note.className = "colnote";
  note.textContent = "Quests first · then grouped by where you find it in game · soonest deadline first" +
    (groups.some(g => g.soft) ? " · permanent goals last" : "") +
    (WEEKLY.length ? " · " + weeklyLeft + " weekly left" : "");
  col.appendChild(note);

  const pinned = PINNED_GROUPS.map(n => active.find(g => g.name === n)).filter(Boolean);
  const rest   = active.filter(g => !PINNED_GROUPS.includes(g.name));
  pinned.forEach(g => col.appendChild(card(g)));
  renderWeekly(col);
  rest.forEach(g => col.appendChild(card(g)));
  pending.forEach(g => col.appendChild(pendingLine(g)));
}

function card(g){
  const sec = document.createElement("section");
  sec.className = "card" + (g.soft ? " soft" : "");

  const head = document.createElement("header");
  const name = document.createElement("span");
  name.className = "name"; name.textContent = g.name;
  const when = document.createElement("span");
  when.className = "when" + (!g.soft && g.slack <= 3 ? " hot" : "");
  when.textContent = g.soft ? "permanent"
    : g.slack <= 0 ? "start now"
    : g.deadlineAt > +bannerEnd ? "ends " + fmt(new Date(g.deadlineAt))   // runs past the update
    : g.deadlineAt >= +bannerEnd
      ? "start by " + Math.max(0, Math.min(...g.live.map(t => t.startBy))) + "d left"
      : "ends " + fmt(new Date(g.deadlineAt));
  // Collapsible. Open by default; the header keeps a done count so a closed card
  // still tells you where it stands.
  const open = !((ui.closed || {})[g.name]);
  const tally = document.createElement("span");
  tally.className = "of";
  tally.textContent = g.live.filter(t => done[t.title]).length + " / " + g.live.length;
  const bodyEl = document.createElement("div");
  bodyEl.className = "cardbody";
  bodyEl.hidden = !open;
  const btn = discloser(bodyEl);
  btn.onclick = () => { (ui.closed = ui.closed || {})[g.name] = !bodyEl.hidden; saveUI(); renderAll(); };
  const right = document.createElement("span");
  right.className = "cardright";
  right.append(tally, when, checkAllButton(g.live), btn);
  head.append(name, right);
  sec.append(head, bodyEl);
  sec.classList.toggle("closed", !open);

  // Tabs: distinct labels in written order. Rows with no tab sit under the first.
  // Wide screens: a vertical rail beside one pane. Narrow: an accordion of the
  // same sections, remembering which are open.
  const tabs = [...new Set(g.all.filter(t => t.tab).map(t => t.tab))];
  let visible = g.visible, hidden = g.hidden;
  if (tabs.length){
    const want = (ui.tabs || {})[g.name];
    const active = tabs.includes(want) ? want : tabs[0];
    const tabLabel = name => {
      const rows = g.all.filter(t => (t.tab || tabs[0]) === name);
      const n = rows.reduce((a,t) => a + (t.items ? t.items.length : 0), 0);
      if (!n) return null;
      const k = rows.reduce((a,t) => a + (t.items || []).filter(i => done[itemKey(t, i)]).length, 0);
      const sm = document.createElement("small"); sm.textContent = k + "/" + n; return sm;
    };
    const paneFor = name => {
      const rowsV = g.visible.filter(t => (t.tab || tabs[0]) === name);
      const rowsH = g.hidden.filter(t => (t.tab || tabs[0]) === name);
      const rowsL = g.live.filter(t => (t.tab || tabs[0]) === name);
      const frag = document.createDocumentFragment();
      const bar = document.createElement("div");
      bar.className = "tabbar";
      bar.appendChild(checkAllButton(rowsL, name));
      frag.appendChild(bar);
      const ul = document.createElement("ul");
      const firstItems = rowsV.find(t => t.items && t.items.length);
      rowsV.forEach(t => ul.appendChild(row(t, { firstItems: t === firstItems })));
      frag.appendChild(ul);
      if (rowsH.length) frag.appendChild(lockedLines(rowsH));
      return frag;
    };

    if (NARROW.matches){
      const acc = document.createElement("div");
      acc.className = "acc";
      const openSet = (ui.acc || {})[g.name] || { [active]: true };
      tabs.forEach(name => {
        const sec = document.createElement("section");
        if (openSet[name]) sec.setAttribute("open", "");
        const btn = document.createElement("button");
        btn.type = "button";
        btn.setAttribute("aria-expanded", String(!!openSet[name]));
        btn.append(document.createTextNode(name));
        const lbl = tabLabel(name); if (lbl) btn.appendChild(lbl);
        btn.onclick = () => {
          const set = Object.assign({}, openSet); set[name] = !set[name];
          (ui.acc = ui.acc || {})[g.name] = set; saveUI(); renderAll();
        };
        sec.appendChild(btn);
        if (openSet[name]){
          const body = document.createElement("div");
          body.className = "accbody";
          body.appendChild(paneFor(name));
          sec.appendChild(body);
        }
        acc.appendChild(sec);
      });
      bodyEl.appendChild(acc);
      return sec;
    }

    const tabbed = document.createElement("div");
    tabbed.className = "tabbed";
    const rail = document.createElement("div");
    rail.className = "rail";
    rail.setAttribute("role", "tablist");
    rail.setAttribute("aria-orientation", "vertical");
    tabs.forEach(name => {
      const b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "tab");
      b.setAttribute("aria-selected", String(name === active));
      b.append(document.createTextNode(name));
      const lbl = tabLabel(name); if (lbl) b.appendChild(lbl);
      b.onclick = () => { (ui.tabs = ui.tabs || {})[g.name] = name; saveUI(); renderAll(); };
      rail.appendChild(b);
    });
    const pane = document.createElement("div");
    pane.className = "tabpane";
    pane.setAttribute("role", "tabpanel");
    pane.appendChild(paneFor(active));
    tabbed.append(rail, pane);
    bodyEl.appendChild(tabbed);
    return sec;
  }

  const ul = document.createElement("ul");
  const firstItems = visible.find(t => t.items && t.items.length);
  visible.forEach(t => ul.appendChild(row(t, { firstItems: t === firstItems })));
  bodyEl.appendChild(ul);

  if (hidden.length) bodyEl.appendChild(lockedLines(hidden));
  return sec;
}

/* One line standing in for a run of locked rows, grouped by what they wait on. */
function discloser(hold, n){
  const btn = document.createElement("button");
  btn.className = "disclose";
  btn.type = "button";
  const label = () => (hold.hidden ? "Show" : "Hide") + (n ? " " + n : "");
  btn.textContent = label();
  btn.setAttribute("aria-expanded", "false");
  btn.onclick = () => {
    hold.hidden = !hold.hidden;
    btn.textContent = label();
    btn.setAttribute("aria-expanded", String(!hold.hidden));
  };
  return btn;
}

function lockedLines(hidden){
  const wrap = document.createElement("div");
  lockSummary(hidden).forEach(part => {
    const line = document.createElement("div");
    line.className = "locked-line";
    const txt = document.createElement("span");
    txt.innerHTML = part.tasks.length + (part.tasks.length === 1 ? " task " : " tasks ") +
      '<span class="why">' + part.label + '</span>';
    const hold = document.createElement("ul");
    hold.hidden = true;
    part.tasks.forEach(t => hold.appendChild(row(t)));
    line.append(txt, discloser(hold));
    wrap.append(line, hold);
  });
  return wrap;
}

function pendingLine(g){
  const d = document.createElement("div");
  d.className = "pending";
  const name = document.createElement("span");
  name.className = "name"; name.textContent = g.name;
  const parts = lockSummary(g.hidden);
  const rest = document.createElement("span");
  rest.innerHTML = parts.map(p =>
    p.tasks.length + " " + '<span class="why">' + p.label + '</span>').join(", ");
  const hold = document.createElement("ul");
  hold.hidden = true;
  hold.style.width = "100%";
  g.hidden.forEach(t => hold.appendChild(row(t)));
  d.append(name, rest, discloser(hold), hold);
  return d;
}

/* ============ expired ============
   Individual tasks, not whole groups — a group can outlive some of its rows. */

function renderExpired(){
  const el = document.getElementById("expired");
  el.textContent = "";
  const gone = enriched.filter(t => t.expired);
  if (!gone.length) return;

  const sec = document.createElement("section");
  sec.className = "expired";
  const ul = document.createElement("ul");
  ul.hidden = true;
  gone.forEach(t => ul.appendChild(row(t, {frozen:true, hideMeta:true})));
  const btn = document.createElement("button");
  btn.type = "button";
  const set = () => {
    btn.textContent = (ul.hidden ? "▸  " : "▾  ") + "Expired · " + gone.length +
      (gone.length === 1 ? " task" : " tasks");
    btn.setAttribute("aria-expanded", String(!ul.hidden));
  };
  btn.onclick = () => { ul.hidden = !ul.hidden; set(); };
  set();
  sec.append(btn, ul);
  el.appendChild(sec);
}

/* ============ render ============
   Ticking a box can change the shape of the page — unlocking a chapter moves seven
   tasks out of a collapsed line and into real rows — so everything redraws at once
   rather than patching individual rows. 24 rows; the cost is nothing. */

function renderAll(){
  document.getElementById("doneCount").firstChild.textContent =
    TASKS.filter(t => done[t.title]).length + " / " + TASKS.length;
  renderStory();
  renderGroups();
  renderExpired();
}

/* --- pinned reminders, drawn once --- */
const remEl = document.getElementById("reminders");
REMINDERS.forEach(r => {
  const d = document.createElement("div");
  d.className = "reminder";
  const t = document.createElement("span");
  t.className = "title"; t.textContent = r.title;
  const c = document.createElement(r.href ? "a" : "span");
  c.className = "cadence"; c.textContent = "(" + r.cadence + ")";
  if (r.href){ c.href = r.href; c.target = "_blank"; c.rel = "noopener"; }
  d.append(t, c);
  remEl.appendChild(d);
});

renderAll();

document.getElementById("uncheck").onclick = () => {
  if (!confirm("Clear every checkmark and counter on this page?")) return;
  done = {}; save(); location.reload();
};
</script>
</body>
